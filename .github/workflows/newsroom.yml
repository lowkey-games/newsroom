# Редакция «Срочно в эфир»: раз в 15 минут собирает ленты и каналы, пишет короткий текст о каждой истории
# и выкладывает stories-en.json и stories-ru.json на GitHub Pages. Игра читает их по адресам из Configs.
# Без секретов работает без ИИ (строка из фактов). С ключом Cloudflare — бесплатный пересказ.
# Состояние редакции (что уже видели и пересказали) живёт в кеше Actions между запусками.
name: newsroom

on:
  schedule:
    # не в начало часа: в :00 у GitHub очередь и запуски опаздывают
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch:

permissions:
  contents: write   # только для пустого коммита раз в 50 дней, см. последний шаг
  pages: write
  id-token: write

concurrency:
  group: newsroom
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: newsroom/requirements.txt

      - run: pip install -r newsroom/requirements.txt

      - name: Проверки кода
        working-directory: newsroom
        run: python -m unittest discover -s tests

      - name: Состояние с прошлого запуска
        id: state
        uses: actions/cache/restore@v6
        with:
          path: newsroom/state
          key: newsroom-state-${{ github.run_id }}
          restore-keys: newsroom-state-

      - name: Проход редакции
        working-directory: newsroom
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
          NEWSROOM_REWRITER: ${{ vars.NEWSROOM_REWRITER }}
          NEWSROOM_CF_MODEL: ${{ vars.NEWSROOM_CF_MODEL }}
          NEWSROOM_NEURONS_PER_DAY: ${{ vars.NEWSROOM_NEURONS_PER_DAY }}
          NEWSROOM_SINGLE_AFTER: ${{ vars.NEWSROOM_SINGLE_AFTER }}
        run: python -m newsroom run

      - name: Сохранить состояние
        if: always()
        uses: actions/cache/save@v6
        with:
          path: newsroom/state
          key: ${{ steps.state.outputs.cache-primary-key }}

      - uses: actions/upload-pages-artifact@v5
        with:
          path: newsroom/public

      - id: deploy
        uses: actions/deploy-pages@v5

      - name: Не дать расписанию уснуть
        # в публичном репозитории GitHub выключает расписание после 60 дней без активности
        run: |
          last=$(git log -1 --format=%ct)
          if [ $(( $(date +%s) - last )) -gt $(( 50 * 86400 )) ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit --allow-empty -m "keepalive"
            git push
          fi
